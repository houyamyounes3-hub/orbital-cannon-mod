name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "orbital-cannon-mod (1).zip"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
        working-directory: orbital-cannon-mod
      - uses: actions/upload-artifact@v4
        with:
          name: orbital-cannon-jar
          path: orbital-cannon-mod/build/libs/*.jar
