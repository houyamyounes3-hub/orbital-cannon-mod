name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest zip
        run: |
          NEWEST=$(for z in *.zip; do echo "$(git log -1 --format=%ct -- "$z")|$z"; done | sort -n | tail -1 | cut -d'|' -f2-)
          echo "Using: $NEWEST"
          unzip -q "$NEWEST"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
        working-directory: orbital-cannon-mod
      - uses: actions/upload-artifact@v4
        with:
          name: orbital-cannon-jar
          path: orbital-cannon-mod/build/libs/*.jar
